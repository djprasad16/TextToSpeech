<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Text-to-Audio App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 2em;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 95%;
            max-width: 1200px;
            display: flex;
            gap: 2em;
            align-items: flex-start;
        }
        .left-panel {
            flex: 1;
            min-width: 0;
        }
        .right-panel {
            flex: 1;
            min-width: 0;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 1em;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 1em;
            resize: vertical;
            font-size: 1em;
            font-family: 'Georgia', serif;
            line-height: 1.6;
        }
        .text-display {
            width: 100%;
            min-height: 200px;
            max-height: 400px;
            padding: 1em;
            box-sizing: border-box;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            background-color: #f8f9fa;
            font-size: 1.1em;
            font-family: 'Georgia', serif;
            line-height: 1.8;
            overflow-y: auto;
            text-align: left;
        }
        .sentence {
            display: inline;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .sentence:hover {
            background-color: #e3f2fd;
        }
        .sentence.current {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        .sentence.completed {
            background-color: #d4edda;
            color: #155724;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .stats-display {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 1em;
            margin-bottom: 1em;
            text-align: center;
        }
        .stats-number {
            font-size: 2em;
            font-weight: bold;
            color: #007bff;
        }
        .stats-label {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 0.5em;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1em;
            margin-top: 1em;
        }
        .speed-control {
            margin-bottom: 1em;
            padding: 0.8em;
            background-color: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .speed-control label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 0.5em;
            text-align: center;
        }
        .speed-buttons {
            display: flex;
            gap: 0.3em;
            justify-content: center;
            flex-wrap: wrap;
        }
        .speed-btn {
            padding: 0.4em 0.8em;
            font-size: 0.9em;
            color: #495057;
            background-color: #fff;
            border: 2px solid #dee2e6;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 60px;
            font-weight: 500;
        }
        .speed-btn:hover {
            background-color: #e9ecef;
            border-color: #adb5bd;
        }
        .speed-btn.active {
            background-color: #007bff;
            border-color: #007bff;
            color: white;
            transform: scale(1.05);
        }
        .speed-indicator {
            font-size: 0.8em;
            color: #6c757d;
            font-style: italic;
            text-align: center;
            margin-top: 0.3em;
        }
        .voice-control {
            margin-bottom: 1em;
            padding: 0.8em;
            background-color: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .voice-control label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 0.5em;
            text-align: center;
        }
        .voice-control select {
            width: 100%;
            padding: 0.5em;
            border: 2px solid #007bff;
            border-radius: 4px;
            font-size: 1em;
            background-color: white;
            cursor: pointer;
        }
        .progress-control {
            margin-bottom: 1em;
            padding: 0.8em;
            background-color: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5em;
        }
        .progress-fill {
            height: 100%;
            background-color: #007bff;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        .progress-text {
            font-size: 0.9em;
            color: #6c757d;
            text-align: center;
            font-weight: 500;
        }
        .button-group {
            display: flex;
            gap: 0.5em;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 0.8em 1.5em;
            font-size: 1em;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            flex: 1;
            min-width: 100px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .pause-btn {
            background-color: #ffc107;
        }
        .pause-btn:hover:not(:disabled) {
            background-color: #e0a800;
        }
        .pause-btn.resume {
            background-color: #28a745;
        }
        .pause-btn.resume:hover:not(:disabled) {
            background-color: #218838;
        }
        .stop-btn {
            background-color: #dc3545;
        }
        .stop-btn:hover:not(:disabled) {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h2 style="text-align: center; margin-bottom: 1em;">📝 Text Input</h2>
            <textarea id="text-input" placeholder="Type or paste your text here..."></textarea>
            
            <h3 style="text-align: center; margin-bottom: 0.5em;">🎵 Live Text Display</h3>
            <div class="text-display" id="text-display">
                <p style="color: #6c757d; font-style: italic; text-align: center;">Your text will appear here with live highlighting during speech...</p>
            </div>
        </div>
        
        <div class="right-panel">
            <h2 style="margin-bottom: 1em;">🎙️ Speech Controls</h2>
            
            <div class="stats-display">
                <div class="stats-number" id="sentence-count">0</div>
                <div class="stats-label">Total Sentences</div>
                <div style="margin-top: 1em;">
                    <span class="stats-number" id="current-sentence">0</span>
                    <span style="font-size: 1.2em; color: #6c757d;"> / </span>
                    <span class="stats-number" id="total-sentences">0</span>
                </div>
                <div class="stats-label">Current Sentence</div>
            </div>
            
            <div class="controls">
                <div class="speed-control">
                    <label>Speed Control:</label>
                    <div class="speed-buttons">
                        <button class="speed-btn" data-speed="0.5" onclick="setSpeed(0.5)">0.5x</button>
                        <button class="speed-btn" data-speed="0.75" onclick="setSpeed(0.75)">0.75x</button>
                        <button class="speed-btn active" data-speed="1" onclick="setSpeed(1)">1x</button>
                        <button class="speed-btn" data-speed="1.25" onclick="setSpeed(1.25)">1.25x</button>
                        <button class="speed-btn" data-speed="1.5" onclick="setSpeed(1.5)">1.5x</button>
                        <button class="speed-btn" data-speed="2" onclick="setSpeed(2)">2x</button>
                    </div>
                    <div class="speed-indicator">✨ Changes speed from current sentence</div>
                </div>
                
                <div class="voice-control">
                    <label for="voice-select">Voice:</label>
                    <select id="voice-select">
                        <option value="">Loading voices...</option>
                    </select>
                </div>
                
                <div class="progress-control">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="progress-text" id="progress-text">Ready to speak</div>
                </div>
                
                <div class="button-group">
                    <button id="speak-btn" onclick="speakText()">Speak</button>
                    <button id="pause-resume-btn" class="pause-btn" onclick="togglePauseResume()" disabled>Pause</button>
                    <button id="stop-btn" class="stop-btn" onclick="stopSpeech()" disabled>Stop</button>
                </div>
            </div>
        </div>
    </div>

    <!-- load the obfuscated/minified bundle -->
    <script src="dist/app.obf.js"></script>
</body>
</html>
